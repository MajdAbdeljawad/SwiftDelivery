spring.application.name=user
server.port=8087


spring.cloud.config.enabled=true
spring.config.import=optional:configserver:http://host.docker.internal:8888

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true

spring.datasource.url=jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver




spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/food

keycloak.server-url=http://localhost:8180
keycloak.realm=food
keycloak.admin-realm=master
keycloak.admin-client-id=admin-cli
keycloak.admin-username=mohamed
keycloak.admin-password=mohamed
keycloak.registration.allow-public-livreur=false