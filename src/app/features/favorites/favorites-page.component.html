<section class="favorites-page container">
  <p class="eyebrow">Favorites</p>
  <h1>Your saved restaurants</h1>
  <div class="favorite-grid">
    <article class="favorite-card" *ngFor="let restaurant of favorites">
      <img [src]="restaurant.image" [alt]="restaurant.name" />
      <div class="content">
        <h3>{{ restaurant.name }}</h3>
        <p>{{ restaurant.description }}</p>
        <a [routerLink]="['/restaurants', restaurant.id]">Open restaurant</a>
      </div>
    </article>
  </div>
</section>
