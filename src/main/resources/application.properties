# Nom de l'application
spring.application.name=gestion-livraison

# Port du microservice
server.port=8085

# URL du serveur Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# DATABASE MYSQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_livraison?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# SHOW SQL IN CONSOLE
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Pour ton microservice Livraison
app.rabbitmq.exchange=restaurants-exchange
app.rabbitmq.queue=livraison-queue
app.rabbitmq.routing-key=livraison-key
#pour config server
spring.config.import=optional:configserver:http://localhost:8888

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always